<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head><body><canvas id="gl"></canvas>
<script type="module">
import * as T from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const q = new URLSearchParams(location.search);
const r = new T.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: false });
r.setSize(600, 400); r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap; r.toneMapping = T.ACESFilmicToneMapping;
if (q.has('clip')) r.localClippingEnabled = true;
const s = new T.Scene(); s.background = new T.Color(0x88aacc);
const cam = new T.PerspectiveCamera(40, 1.5, 0.1, 1000); cam.position.set(40, 25, 50); cam.lookAt(0, 5, 0);
const cut = new T.Plane(new T.Vector3(0, 0, -1), 1e5);
const mat = new T.MeshStandardMaterial({ color: 0xd8d4cc }); if (q.has('clip')) mat.clippingPlanes = [cut];
const g = new T.Mesh(new T.PlaneGeometry(200, 200).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({ color: 0xbbb })); g.receiveShadow = true; s.add(g);
const b = new T.Mesh(new T.BoxGeometry(10, 30, 10), mat); b.position.y = 15; b.castShadow = b.receiveShadow = true; s.add(b);
const sun = new T.DirectionalLight(0xffd2a0, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 10, far: 1400 }); sun.shadow.camera.updateProjectionMatrix();
sun.position.set(-0.78, 0.4, 0.3).normalize().multiplyScalar(600); s.add(sun, sun.target);
s.add(new T.AmbientLight(0xffffff, 0.3));
let composer = null;
if (q.has('comp')) { composer = new EffectComposer(r, new T.WebGLRenderTarget(4, 4, { type: T.HalfFloatType, samples: q.has('ms') ? 4 : 0 })); composer.addPass(new RenderPass(s, cam)); composer.addPass(new OutputPass()); composer.setSize(600, 400); }
function loop() { requestAnimationFrame(loop); composer ? composer.render() : r.render(s, cam); }
loop();
</script></body></html>
